name: Bug report
description: Report a reproducible problem in the static web UI or repository documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real names, contact details, health information, credentials, tokens, or other sensitive data. Use fictional examples.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that demonstrates the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, or Node.js version, as applicable.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add safe console output or screenshots with sensitive values redacted.
